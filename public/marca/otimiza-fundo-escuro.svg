    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="164" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"></stop><stop offset="0.34" stop-color="#8a8a8a"></stop><stop offset="0.72" stop-color="#000"></stop>
    </linearGradient>
    <mask id="fadeMask" maskUnits="userSpaceOnUse" x="-10" y="-10" width="190" height="190">
      <rect x="-10" y="-10" width="190" height="190" fill="url(#fade)"></rect>
    </mask>
    <mask id="ring" maskUnits="userSpaceOnUse" x="-10" y="-10" width="190" height="190">
      <rect x="-10" y="-10" width="190" height="190" fill="#fff"></rect>
      <rect x="-10" y="-10" width="190" height="190" fill="url(#dots)" mask="url(#fadeMask)"></rect>
