    <circle cx="820" cy="140" r="22.7" fill="#F03A2E"></circle>
    <text x="169" y="222" font-family="&#39;Roboto Mono&#39;, monospace" font-weight="700" font-size="34.3" letter-spacing="5.3" fill="#F2C500">Consultoria Econômica</text>
